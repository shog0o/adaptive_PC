<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <title>금호건설:회원정보 입력</title>
    <script src="https://kit.fontawesome.com/41c9e9a1a8.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="./css/member.css">
</head>
<body>
    <div id="skipNav"><a href="#content">본문 바로가기</a><a href="#gnb">네비게이션 바로가기</a></div>
    <div id="wrap">
        <header id="headerArea"></header>
        <main id="content" class="member_content">
            <article class="member_box">
                <h2>회원가입 정보</h2>
                <span class="member_intro"><span class="required">*</span> 표시는 필수 입력 항목입니다.</span>
                <form class="member_form" action="#" method="post">
                    <ul>
                        <li><label for="memberId">아이디<span class="required">*</span></label><input type="text" id="memberId" name="memberId" placeholder="아이디를 입력해 주세요." required></li>
                        <li><label for="memberPass">비밀번호<span class="required">*</span></label><input type="password" id="memberPass" name="memberPass" placeholder="비밀번호를 입력해 주세요." required></li>
                        <li><label for="memberPass2">비밀번호 확인<span class="required">*</span></label><input type="password" id="memberPass2" name="memberPass2" placeholder="비밀번호를 다시 입력해 주세요." required></li>
                        <li><label for="memberName">이름<span class="required">*</span></label><input type="text" id="memberName" name="memberName" placeholder="이름을 입력해 주세요." required></li>
                        <li><label for="memberNick">닉네임</label><input type="text" id="memberNick" name="memberNick" placeholder="닉네임을 입력해 주세요."></li>
                        <li>
                            <span class="form_label">휴대전화번호<span class="required">*</span></span>
                            <div class="form_row">
                                <label class="hidden" for="hp1">전화번호 앞자리</label><select id="hp1" name="hp1"><option value="010">010</option><option value="011">011</option></select>
                                <span>-</span><label class="hidden" for="hp2">전화번호 중간 자리</label><input type="text" id="hp2" name="hp2" maxlength="4" required>
                                <span>-</span><label class="hidden" for="hp3">전화번호 끝자리</label><input type="text" id="hp3" name="hp3" maxlength="4" required>
                            </div>
                        </li>
                        <li>
                            <span class="form_label">이메일<span class="required">*</span></span>
                            <div class="form_row">
                                <label class="hidden" for="mail1">이메일 아이디</label><input type="text" id="mail1" name="mail1" required>
                                <span class="at">@</span>
                                <label class="hidden" for="mail2">이메일 주소</label><input type="text" id="mail2" name="mail2" required>
                            </div>
                        </li>
                    </ul>
                    <div class="member_button"><button class="secondary" type="reset">다시 쓰기</button><button class="primary" type="submit">회원가입</button></div>
                </form>
            </article>
        </main>
        <footer id="footerArea"></footer>
    </div>
    <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/jquery-migrate-1.4.1.min.js"></script>
    <script src="../js/jquery.easing.1.3.js"></script>
    <script>
        $('#headerArea').load('../common/sub_header.html',function(){
            $.getScript('../js/fullnav.js');
        });
        $('#footerArea').load('../common/sub_footer.html',function(){
            $.getScript('../js/select.js');
        });
    </script>
</body>
</html>
