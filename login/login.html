<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <title>금호건설:로그인</title>
    <script src="https://kit.fontawesome.com/41c9e9a1a8.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../member/css/member.css">
</head>
<body>
    <div id="skipNav"><a href="#content">본문 바로가기</a><a href="#gnb">네비게이션 바로가기</a></div>
    <div id="wrap">
        <header id="headerArea"></header>
        <main id="content" class="member_content">
            <article class="member_box login_box">
                <h2>로그인</h2>
                <span class="member_intro">회원가입 시 등록한 아이디와 비밀번호를 입력해 주세요.</span>
                <form class="member_form login_form" action="#" method="post">
                    <label for="loginId">아이디</label>
                    <input type="text" id="loginId" name="loginId" placeholder="아이디를 입력해 주세요." required>
                    <label for="loginPass">비밀번호</label>
                    <input type="password" id="loginPass" name="loginPass" placeholder="비밀번호를 입력해 주세요." required>
                    <input class="login_submit" type="submit" value="로그인">
                </form>
                <div class="find_link"><a href="#">아이디 찾기</a><a href="#">비밀번호 찾기</a></div>
                <div class="join_guide"><span>아직 회원이 아니신가요?</span><a href="../member/member_check.html">회원가입</a></div>
            </article>
        </main>
        <footer id="footerArea"></footer>
    </div>
    <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/jquery-migrate-1.4.1.min.js"></script>
    <script src="../js/jquery.easing.1.3.js"></script>
    <script>
        $('#headerArea').load('../common/sub_header.html',function(){
            $.getScript('../js/fullnav.js');
        });
        $('#footerArea').load('../common/sub_footer.html',function(){
            $.getScript('../js/select.js');
        });
    </script>
</body>
</html>
